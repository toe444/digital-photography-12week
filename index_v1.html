<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
      #msg-box {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 24px;
        font-family: sans-serif;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px 32px;
        border-radius: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 9999;
      }
      #msg-box.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="model1" src="문수인_202602001_DP_01반_10주차실습.glb"></a-asset-item>
        <a-asset-item id="model2" src="glass_bottle__minecraft.glb"></a-asset-item>
        <a-asset-item id="model3" src="marshall_guitar_amp.glb"></a-asset-item>
        <img id="bg" src="back2.jpg" />
      </a-assets>

      <!-- 배경 -->
      <a-sky src="#bg"></a-sky>

      <!-- 조명 -->
      <a-entity light="type: ambient; color: #aaaaaa; intensity: 1.0"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.5; distance: 90"
        position="0 6 6"
      ></a-entity>
      <a-entity
        light="type: point; color: #ddccbb; intensity: 1.0; distance: 50"
        position="-4 2 -4"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera
          cursor="rayOrigin: mouse"
          raycaster="objects: .clickable"
          position="0 0 0"
        ></a-camera>

        <!-- 오브젝트 1: 문수인 모델 -->
        <a-entity
          rotation="15 0 20"
          animation="property: rotation; to: 360 360 360; loop: true; dur: 8000; easing: linear;"
        >
          <a-gltf-model
            class="clickable"
            data-msg="문수인입니다"
            src="#model1"
            position="2.5 0.2 0"
            scale="0.8 0.8 0.8"
            animation="property: rotation; to: 360 360 -360; loop: true; dur: 5000; easing: linear;"
          ></a-gltf-model>
        </a-entity>

        <!-- 오브젝트 2: 물병 -->
        <a-entity
          rotation="30 0 -20"
          animation="property: rotation; to: -360 360 360; loop: true; dur: 10000; easing: linear;"
        >
          <a-gltf-model
            class="clickable"
            data-msg="물병입니다"
            src="#model2"
            position="1.2 -0.1 0"
            scale="1.3 1.3 1.3"
            animation="property: rotation; to: 360 -360 360; loop: true; dur: 6000; easing: linear;"
          ></a-gltf-model>
        </a-entity>

        <!-- 오브젝트 3: 앰프 -->
        <a-entity
          rotation="-25 0 15"
          animation="property: rotation; to: 360 -360 -360; loop: true; dur: 12000; easing: linear;"
        >
          <a-gltf-model
            class="clickable"
            data-msg="앰프입니다"
            src="#model3"
            position="2.5 0.35 0"
            scale="2 2 2"
            animation="property: rotation; to: -360 360 360; loop: true; dur: 7000; easing: linear;"
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <div id="msg-box"></div>

    <script>
      var msgBox = document.getElementById("msg-box");
      var hideTimer;
      document.querySelectorAll(".clickable").forEach(function (el) {
        el.addEventListener("click", function () {
          var msg = el.getAttribute("data-msg");
          msgBox.textContent = msg;
          msgBox.classList.add("show");
          clearTimeout(hideTimer);
          hideTimer = setTimeout(function () {
            msgBox.classList.remove("show");
          }, 2500);
        });
      });
    </script>
  </body>
</html>
